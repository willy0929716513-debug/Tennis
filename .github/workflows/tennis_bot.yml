name: Tennis Bot

on:
  # 每天台灣時間 07:00 / 13:00 / 19:00 自動執行（= UTC 23/05/11）
  schedule:
    - cron: "0 23 * * *"   # 台灣 07:00
    - cron: "0 5  * * *"   # 台灣 13:00
    - cron: "0 11 * * *"   # 台灣 19:00
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Also run backtest validation?"
        required: false
        default: "false"

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Sackmann CSV files
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          YEAR=$(date +%Y)
          for TOUR in atp wta; do
            mkdir -p /tmp/sackmann_${TOUR}
            REPO="JeffSackmann/tennis_${TOUR}"
            # Players and rankings (always exist)
            for FILE in ${TOUR}_players.csv ${TOUR}_rankings_current.csv; do
              HTTP=$(curl -sf \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github.raw+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/contents/${FILE}" \
                -o /tmp/sackmann_${TOUR}/${FILE} \
                -w "%{http_code}" 2>/dev/null || echo "000")
              echo "${TOUR}/${FILE}: HTTP ${HTTP}"
            done
            # Match files for last 3 years (may not exist yet)
            for Y in $YEAR $((YEAR-1)) $((YEAR-2)); do
              FILE="${TOUR}_matches_${Y}.csv"
              HTTP=$(curl -sf \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github.raw+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${REPO}/contents/${FILE}" \
                -o /tmp/sackmann_${TOUR}/${FILE} \
                -w "%{http_code}" 2>/dev/null || echo "000")
              echo "${TOUR}/${FILE}: HTTP ${HTTP}"
            done
          done
          # Show what we got
          ls -lh /tmp/sackmann_atp/ /tmp/sackmann_wta/ 2>/dev/null || true

      - name: Run Tennis Bot
        env:
          ODDS_API_KEY:    ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIST_TOKEN:      ${{ secrets.GIST_TOKEN }}
          GIST_ID:         ${{ secrets.GIST_ID }}
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          SACKMANN_ATP_PATH: /tmp/sackmann_atp
          SACKMANN_WTA_PATH: /tmp/sackmann_wta
        run: python tennis_bot.py

      - name: Commit updated picks
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/picks_latest.json /tmp/picks_new.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/picks_new.json docs/picks_latest.json
          git add docs/picks_latest.json
          git diff --cached --quiet || git commit -m "chore: update tennis picks [skip ci]"
          git push origin HEAD:main

  # 每週一 UTC 03:00 自動執行回測，或手動觸發時選擇
  backtest:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_backtest == 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Backtest
        id: backtest
        run: |
          python backtest.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Show Backtest Summary
        if: always()
        run: |
          if [ -f docs/backtest_results.json ]; then
            echo "=== BACKTEST RESULTS ==="
            python3 -c "
          import json
          with open('docs/backtest_results.json') as f: m=json.load(f)
          ov=m['overall']; bm=m['benchmarks']
          print(f'Verdict:   {m[\"verdict\"]}')
          print(f'Accuracy:  {ov[\"accuracy\"]}%  (random: {bm[\"random_accuracy\"]})')
          print(f'Brier:     {ov[\"brier_score\"]}  (random: {ov[\"random_brier\"]})')
          print(f'Log-Loss:  {ov[\"log_loss\"]}')
          print(f'Improvement vs random Brier: {ov[\"brier_improvement_vs_random\"]}')
          "
          fi

      - name: Commit backtest results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest_results.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update backtest results [skip ci]"
          git push origin HEAD:main || echo "Nothing to push"
