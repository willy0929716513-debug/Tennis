name: Tennis Bot

on:
  # 各地區開賽前3小時執行 — 推薦顯示 + 同步寫入投注紀錄
  # 澳洲/亞洲賽事 ~00:00 UTC 開賽 → 21:00 UTC（台灣 05:00）
  # 歐洲賽事     ~10:00 UTC 開賽 → 07:00 UTC（台灣 15:00）
  # 美洲賽事     ~15:00 UTC 開賽 → 12:00 UTC（台灣 20:00）
  # 每週一 01:00 UTC（台灣 09:00）自動執行回測
  schedule:
    - cron: "0 21 * * *"   # 台灣 05:00 — 澳網/亞洲賽事前3h
    - cron: "0 7  * * *"   # 台灣 15:00 — 歐洲賽事前3h（法網/溫網）
    - cron: "0 12 * * *"   # 台灣 20:00 — 美洲賽事前3h（美網/邁阿密）
    - cron: "0 1  * * 1"   # 台灣 週一 09:00 — 每週回測
  workflow_dispatch:
    inputs:
      run_backtest:
        description: "Also run backtest validation?"
        required: false
        default: "false"

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download tennis CSV files
        run: |
          BASE="https://raw.githubusercontent.com/mikahon"
          YEAR=$(date +%Y)
          for TOUR in atp wta; do
            mkdir -p /tmp/sackmann_${TOUR}
            # Players and rankings (always exist in mirror)
            for FILE in ${TOUR}_players.csv ${TOUR}_rankings_current.csv; do
              HTTP=$(curl -s -w "%{http_code}" \
                "${BASE}/tennis_${TOUR}/master/${FILE}" \
                -o /tmp/sackmann_${TOUR}/${FILE})
              echo "${TOUR}/${FILE}: HTTP ${HTTP}"
              [ "$HTTP" = "200" ] || rm -f /tmp/sackmann_${TOUR}/${FILE}
            done
            # Match files: try last 3 historical years (year-2 to year-4)
            for Y in $((YEAR-2)) $((YEAR-3)) $((YEAR-4)); do
              FILE="${TOUR}_matches_${Y}.csv"
              HTTP=$(curl -s -w "%{http_code}" \
                "${BASE}/tennis_${TOUR}/master/${FILE}" \
                -o /tmp/sackmann_${TOUR}/${FILE})
              echo "${TOUR}/${FILE}: HTTP ${HTTP}"
              [ "$HTTP" = "200" ] || rm -f /tmp/sackmann_${TOUR}/${FILE}
            done
          done
          ls -lh /tmp/sackmann_atp/ /tmp/sackmann_wta/ 2>/dev/null || true

      - name: Download msolonskyi ATP data (2025-2026, weekly-updated)
        run: |
          mkdir -p /tmp/msolonskyi_atp
          BASE="https://raw.githubusercontent.com/msolonskyi/ManTennisData/master/atp"
          YEAR=$(date +%Y)
          # Tournament metadata (surface, dates) — required for schema join
          HTTP=$(curl -s -w "%{http_code}" "${BASE}/tournaments.csv" \
            -o /tmp/msolonskyi_atp/tournaments.csv)
          echo "tournaments.csv: HTTP ${HTTP}"
          [ "$HTTP" = "200" ] || rm -f /tmp/msolonskyi_atp/tournaments.csv
          # Current year and last year matches
          for Y in ${YEAR} $((YEAR-1)); do
            HTTP=$(curl -s -w "%{http_code}" "${BASE}/matches_${Y}.csv" \
              -o /tmp/msolonskyi_atp/matches_${Y}.csv)
            echo "atp/matches_${Y}.csv: HTTP ${HTTP}"
            [ "$HTTP" = "200" ] || rm -f /tmp/msolonskyi_atp/matches_${Y}.csv
          done
          ls -lh /tmp/msolonskyi_atp/ 2>/dev/null || true

      - name: Run Tennis Bot
        env:
          ODDS_API_KEY:    ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GIST_TOKEN:      ${{ secrets.GIST_TOKEN }}
          GIST_ID:         ${{ secrets.GIST_ID }}
          NTFY_TOPIC:      ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          SACKMANN_ATP_PATH:    /tmp/sackmann_atp
          SACKMANN_WTA_PATH:    /tmp/sackmann_wta
          MSOLONSKYI_ATP_PATH:  /tmp/msolonskyi_atp
        run: python tennis_bot.py

      - name: Commit updated picks
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp docs/picks_latest.json /tmp/picks_new.json
          [ -f docs/history.json ] && cp docs/history.json /tmp/history_new.json || true
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/picks_new.json docs/picks_latest.json
          [ -f /tmp/history_new.json ] && cp /tmp/history_new.json docs/history.json || true
          git add docs/picks_latest.json
          [ -f docs/history.json ] && git add docs/history.json || true
          git diff --cached --quiet || git commit -m "chore: update tennis picks [skip ci]"
          git push origin HEAD:main

  # 每週一台灣09:00自動執行回測，或手動觸發時選擇
  backtest:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_backtest == 'true')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Backtest
        id: backtest
        run: |
          python backtest.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Show Backtest Summary
        if: always()
        run: |
          if [ -f docs/backtest_results.json ]; then
            echo "=== BACKTEST RESULTS ==="
            python3 -c "
          import json
          with open('docs/backtest_results.json') as f: m=json.load(f)
          ov=m['overall']; bm=m['benchmarks']
          print(f'Verdict:   {m[\"verdict\"]}')
          print(f'Accuracy:  {ov[\"accuracy\"]}%  (random: {bm[\"random_accuracy\"]})')
          print(f'Brier:     {ov[\"brier_score\"]}  (random: {ov[\"random_brier\"]})')
          print(f'Log-Loss:  {ov[\"log_loss\"]}')
          print(f'Improvement vs random Brier: {ov[\"brier_improvement_vs_random\"]}')
          "
          fi

      - name: Commit backtest results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/backtest_results.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update backtest results [skip ci]"
          git push origin HEAD:main || echo "Nothing to push"
